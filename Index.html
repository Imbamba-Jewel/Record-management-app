<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing page</title>
    <link rel="stylesheet" href="styles.css">
    <style>
       * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, white 0%,#2a4acd 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333;
        }
        
           /*NAVBAR — matches the Login page styling*/
        header {
            background-color: #333;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        header h1 {
            font-size: 24px;
        }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
                .nav-links a:hover {
            background-color: #555;
            text-decoration: none;
        }

        /* PAGE CONTENT*/
        .page-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .page-header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .page-header h2 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .page-header p {
            font-size: 18px;
            opacity: 0.9;
            text-align: center;
            padding: 0;
            font-family: inherit;
        }
        .page-header img {
            height: 300px;
            width: auto;
            max-width: 100%;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            object-fit: cover;
        }

        /* ROLE BUTTONS*/
        .role-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
            width: 100%;
        }

        .role-btn {
            flex: 1;
            min-width: 280px;
            max-width: 380px;
            background-color: white;
            border: none;
            border-radius: 12px;
            padding: 35px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            font-family: inherit;
        }

        .role-btn:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            background-color: #f8f9fa;
        }

        .role-btn:active {
            transform: translateY(-3px);
        }
         .role-btn h3 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #007bff;
            letter-spacing: 1px;
        }

        .role-btn.admin-btn h3 {
            color: #dc3545;
        }

        .role-btn.employee-btn h3 {
            color: #28a745;
        }
        .role-btn h4 {
            font-size: 15px;
            font-weight: normal;
            color: #666;
            line-height: 1.6;
        }

        .role-icon {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
        }

        /* RESPONSIVE*/
          @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .page-header h2 {
                font-size: 26px;
            }

            .page-header img { 
                height: 200px;
            }

            .role-btn {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
     <header>
        <h1>My Website</h1>
        <nav>
            <ul class="nav-links">
                <li><a href="Index.html">Home</a></li>
                <li><a href="Login.html">Login</a></li>
                <li><a href="Records.html">Records</a></li>
            </ul>
        </nav>
    </header>
    <div class="page-header">
    <h2>Employee Management App</h2>
    <p>Welcome to MyWebsite:)</p>
    <img src="work.jpg" style="height:500px;">
    </div>
        <div class="role-container">
            <button class="role-btn admin-btn" onclick="goToLogin('department-admin')">
            <h3>ADMIN</h3>
            <h4>Get to alter records of existing employees and add records of new employees as they join the establishment.</h4>
            <button class="role-btn employee-btn" onclick="goToLogin('employee')">
            <h3>EMPLOYEE</h3>
            <h4>View records and apply for leave</h4>
            </button>
        </div>
   <script>
            function goToLogin(role) {
            // Optionally store the selected role to pre-select it on the login page
            sessionStorage.setItem('preselectedRole', role);
            // Redirect to login page
            window.location.href = 'Login.html';
            }
   </script>     

    
</body>
</html>
