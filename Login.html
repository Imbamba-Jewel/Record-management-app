<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
        form {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: #dc3545;
            margin-top: 15px;
            text-align: center;
            padding: 10px;
            background-color: #f8d7da;
            border-radius: 4px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        h3 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            color: #333;
        }
        .success-message {
            color: #28a745;
            margin-top: 15px;
            text-align: center;
            padding: 10px;
            background-color: #d4edda;
            border-radius: 4px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Website</h1>
        <nav>
            <ul class="nav-links">
                <li><a href="Index.html">Home</a></li>
                <li><a href="Login.html">Login</a></li>
                <li><a href="Records.html">Records</a></li>
            </ul>
        </nav>
    </header>

    <form id="loginForm">
        <h3> Login</h3>
        
        <div class="form-group">
            <label for="role">Login as</label>
            <select id="role" name="role">
                <option value="employee">Employee</option>
                <option value="department-admin">Admin</option>
            </select>
        </div>
        
        <div id="employeeFields">
            <div class="form-group">
                <label for="empName">Employee Name</label>
                <input type="text" id="empName" placeholder="Enter your Full Name">
            </div>
        </div>
        <div class="form-group">
            <label for="empPassword">Password</label>
            <input type="password" id="empPassword" placeholder="Enter password" required>
        </div>
        
        <button type="submit">Login</button>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
    </form>
    <script>
        if (window.location.protocol === 'file:') {
            window.location.replace('http://localhost/Record%20management%20app/Login.html');
        }
    </script>
    <script>
    const API_URL = window.location.protocol === 'file:'
        ? 'http://localhost/Record%20management%20app/api'
        : 'api';

    const loginForm = document.getElementById('loginForm');
    const roleSelect = document.getElementById('role');
    const employeeFields = document.getElementById('employeeFields');
    const errorElement = document.getElementById('errorMessage');
    const successElement = document.getElementById('successMessage');
    document.getElementById('empName').required = true;
    document.getElementById('empPassword').required = true;

    const preselectedRole = sessionStorage.getItem('preselectedRole');
    if (preselectedRole && [...roleSelect.options].some(option => option.value === preselectedRole)) {
        roleSelect.value = preselectedRole;
        sessionStorage.removeItem('preselectedRole');
    }

    loginForm.addEventListener('submit', async event => {
        event.preventDefault();
        errorElement.classList.remove('show');
        successElement.classList.remove('show');

        const name = document.getElementById('empName').value.trim();
        const password = document.getElementById('empPassword').value.trim();

        if (!name || !password) {
            errorElement.textContent = 'Please enter your login details.';
            errorElement.classList.add('show');
            return;
        }

        try {
            const response = await fetch(`${API_URL}/login.php`, {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, password })
            });
            const data = await response.json();
            if (!response.ok || !data.success) {
                throw new Error(data.message || 'Login failed');
            }

            sessionStorage.setItem('authToken', data.token);
            sessionStorage.setItem('userRole', data.role);
            sessionStorage.setItem('userName', data.name);
            sessionStorage.setItem('userId', data.userId);
            successElement.textContent = 'Login successful! Redirecting...';
            successElement.classList.add('show');
            setTimeout(() => window.location.href = 'Records.html', 800);
        } catch (error) {
            errorElement.textContent = error.message;
            errorElement.classList.add('show');
        }
    });
    </script>
</body>
</html>
