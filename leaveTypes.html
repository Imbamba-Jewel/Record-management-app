<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
    font-family: Arial, sans-serif;
     background-color: #f4f4f4;
     margin: 0;
    padding: 0;
    }
    header {
    background-color: #333;
    color: white;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
     align-items: center;
    }   
    .nav-links {
    list-style: none;
    display: flex;
    gap: 20px;
    margin: 0;
    padding: 0;
    }
    .nav-links a {
    color: white;
    text-decoration: none;
    }
    .nav-links a:hover {
    text-decoration: underline;
    }
    .user-info {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #ddd;
    }
    .user-info span {
        color: #fff;
        font-weight: bold;
    }
    .logout-btn {
        width: auto;
        margin: 0;
        padding: 7px 14px;
        background-color: #dc3545;
    }
    .logout-btn:hover {
        background-color: #c82333;
    }
    form {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: red;
            margin-top: 10px;
            text-align: center;
        }
        h3 {
            text-align: center;
            margin-top: 0;
        }
    </style>
</head>

<body>
    <header>
        <h1>My Website</h1>
        <nav>
            <ul class="nav-links">
                <li><a href="Index.html">Home</a></li>
                <li><a href="Login.html">Login</a></li>
                <li><a href="Records.html" class="active">Records</a></li>
            </ul>
        </nav>
        <div class="user-info">
            Logged in as: <span id="userDisplay">User</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>
    <h2>Leave Types</h2>
     <!-- show leave types from the database -->
    <div id="leaveTypesList">
        <!-- Leave types will be populated here by JavaScript -->
    </div>

    <!-- addleave button  -->
    <button onclick="window.location.href='addLeave.html'">Add Leave Type</button>

    <script>
        const API_URL = window.location.protocol === 'file:'
            ? 'http://localhost/Record%20management%20app/api'
            : 'api';

        document.getElementById('userDisplay').textContent = sessionStorage.getItem('userName') || 'User';

        async function logout() {
            try {
                await fetch(`${API_URL}/logout.php`, {
                    method: 'POST',
                    credentials: 'include'
                });
            } finally {
                sessionStorage.clear();
                window.location.href = 'Login.html';
            }
        }

        // Fetch leave types from the database and display them
        fetch(`${API_URL}/get_leave_types.php`, { credentials: 'include' })
            .then(response => response.json())
            .then(data => {
                const leaveTypesList = document.getElementById('leaveTypesList');
                if (data.success) {
                    const leaveTypes = data.leaveTypes;
                    if (leaveTypes.length > 0) {
                        const ul = document.createElement('ul');
                        leaveTypes.forEach(leaveType => {
                            const li = document.createElement('li');
                            li.textContent = `${leaveType.leave_type} - ${leaveType.description}`;
                            ul.appendChild(li);
                        });
                        leaveTypesList.appendChild(ul);
                    } else {
                        leaveTypesList.textContent = 'No leave types found.';
                    }
                } else {
                    leaveTypesList.textContent = 'Error fetching leave types: ' + data.message;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('leaveTypesList').textContent = 'An error occurred while fetching leave types.';
            });
    </script>
</body>
</html>
