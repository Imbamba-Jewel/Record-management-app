<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
    font-family: Arial, sans-serif;
     background-color: #f4f4f4;
     margin: 0;
    padding: 0;
    }
    header {
    background-color: #333;
    color: white;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
     align-items: center;
    }   
    .nav-links {
    list-style: none;
    display: flex;
    gap: 20px;
    margin: 0;
    padding: 0;
    }
    .nav-links a {
    color: white;
    text-decoration: none;
    }
    .nav-links a:hover {
    text-decoration: underline;
    }
    .user-info {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #ddd;
    }
    .user-info span {
        color: #fff;
        font-weight: bold;
    }
    .logout-btn {
        width: auto;
        margin: 0;
        padding: 7px 14px;
        background-color: #dc3545;
    }
    .logout-btn:hover {
        background-color: #c82333;
    }
    form {
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: red;
            margin-top: 10px;
            text-align: center;
        }
        h3 {
            text-align: center;
            margin-top: 0;
        }
        .addleaveform {
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>
    <header>
        <h1>My Website</h1>
        <nav>
            <ul class="nav-links">
                <li><a href="Index.html">Home</a></li>
                <li><a href="Login.html">Login</a></li>
                <li><a href="Records.html" class="active">Records</a></li>
            </ul>
        </nav>
        <div class="user-info">
            Logged in as: <span id="userDisplay">User</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    
    <h3>Add Leave Type</h3>
    <form id="addLeaveForm">
        <label for="leaveType">Leave Type:</label>
        <input type="text" id="leaveType" name="leaveType" required>
        <label for="description">Description:</label>
        <textarea id="description" name="description" required></textarea>
        <button type="submit">Add Leave Type</button>
    </form>
    <script>
        const API_URL = window.location.protocol === 'file:'
            ? 'http://localhost/Record%20management%20app/api'
            : 'api';

        document.getElementById('userDisplay').textContent = sessionStorage.getItem('userName') || 'User';

        async function logout() {
            try {
                await fetch(`${API_URL}/logout.php`, {
                    method: 'POST',
                    credentials: 'include'
                });
            } finally {
                sessionStorage.clear();
                window.location.href = 'Login.html';
            }
        }

        document.getElementById('addLeaveForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const leaveType = document.getElementById('leaveType').value.trim();
            const description = document.getElementById('description').value.trim();

            if (leaveType && description) {
                fetch(`${API_URL}/add_leave_type.php`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ leaveType, description })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('Leave type added successfully!');
                        window.location.href = 'leaveTypes.html';
                    } else {
                        alert('Error adding leave type: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while adding the leave type.');
                });
            } else {
                alert('Please enter a leave type.');
            }
        });
    </script>
</body>
</html>
